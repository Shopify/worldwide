version: 2
updates:
  - package-ecosystem: bundler
    directory: "/"
    schedule:
      interval: daily
    open-pull-requests-limit: 5
    insecure-external-code-execution: allow
    groups:
      bundler-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      # Dependabot resolves the bundle with Ruby 3.1.7, the lowest version
      # worldwide.gemspec allows. pry-byebug >= 3.12 requires Ruby >= 3.2, so
      # every attempt to update it fails. The Gemfile also caps it at < 3.12.
      - dependency-name: "pry-byebug"
        versions: [">= 3.12"]
  - package-ecosystem: npm
    directory: "/lang/typescript"
    schedule:
      interval: daily
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      github-actions-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      # Can not bump past v1.5.1 until https://github.com/changesets/action/issues/501 is fixed
      - dependency-name: "changesets/action"
        versions: [">=1.5.1"]
